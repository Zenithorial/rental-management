version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: rental_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: mypassword
      POSTGRES_DB: rental_management
    ports:
      - '9005:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
